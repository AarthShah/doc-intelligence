[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-intelligence"
version = "0.1.1"
description = "Autonomous AI Document Intelligence & RAG Evaluation Platform"
readme = "README.md"
authors = [
    { name = "Aarth Shah", email = "aarths123@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["rag", "document-intelligence", "chunking", "vector-search", "hallucination-evaluation", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/aarthishah/doc-intelligence"
Repository = "https://github.com/aarthishah/doc-intelligence"
Documentation = "https://aarthishah.github.io/doc-intelligence/"

dependencies = [
    "pyyaml>=6.0",
    "ebooklib>=0.18",
    "fastembed>=0.2.0",  # Core dependency for embedding
    "sentence-transformers>=3.0.0", # Core dependency for semantic search and evaluation
    "python-dotenv>=1.0.0", # For environment variable management
]

[project.scripts]
ingest-docs = "doc_intelligence.cli.ingestion:main"
evaluation-cli = "doc_intelligence.cli.evaluation:main"
dashboard = "streamlit run src/doc_intelligence/dashboard/app.py"

[project.optional-dependencies]
api = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0", # Added [standard] for production use
]
dev = [
    "pytest>=7.0",
    "pytest-benchmark>=4.0.0",
    "sentence-transformers>=3.0.0",  # Added for AnswerRelevanceEvaluator
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
