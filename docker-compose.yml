version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
    - "8000:8000"
    environment:
    - PYTHONUNBUFFERED=1
    volumes:
    - ./src:/app/src
    - ./data:/app/data
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
